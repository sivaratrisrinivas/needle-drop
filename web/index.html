<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Needle Drop</title>
<meta name="description" content="Describe a scene or drop a clip. Get songs that fit it, each with a license verdict.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<video id="bg" muted loop playsinline aria-hidden="true"></video>

<a class="mark" href="./" aria-label="Needle Drop">needle drop<i></i></a>

<main>
  <section id="ask">
    <textarea id="scene" rows="1" spellcheck="false" autofocus aria-label="Describe the scene" title="Press Tab to use the suggestion"></textarea>
    <p id="hint">
      <span>↵ find</span>
      <span><button id="pick" type="button">drop a clip</button><em id="samples"> or try <button type="button" data-sample="chase">chase</button> / <button type="button" data-sample="dawn">dawn</button></em></span>
      <span>for <button id="use" type="button" aria-label="Intended use, click to change"></button></span>
    </p>
    <p id="clip" hidden><span id="clipname"></span> <button id="unclip" type="button" aria-label="Remove clip">✕</button></p>
    <p id="status" role="status" aria-live="polite"></p>
  </section>

  <section id="out" hidden>
    <p id="brief" class="line" tabindex="0" role="button" aria-expanded="false"></p>
    <div id="briefmore" class="more" hidden></div>
    <p id="clipline" class="line" tabindex="0" role="button" aria-expanded="false" hidden></p>
    <div id="clipmore" class="more" hidden></div>
    <p id="warn"></p>
    <ol id="crate"></ol>
    <p id="foot">
      <span id="count"></span>
      <button id="only" type="button" aria-pressed="false">only cleared</button>
      <button id="tracebtn" type="button" aria-expanded="false">trace</button>
    </p>
    <p id="note"></p>
    <div id="trace" class="more" hidden></div>
  </section>
</main>

<div id="drop" hidden><span>drop</span></div>
<input type="file" id="file" accept="video/*,.srt" multiple hidden>
<audio id="player" preload="none"></audio>
<script src="app.js"></script>
</body>
</html>
